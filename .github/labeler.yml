# Auto-labeling configuration for PRs based on changed files
# Format for actions/labeler@v5

# Python code changes
python:
  - changed-files:
    - any-glob-to-any-file: '**/*.py'

# Tests
tests:
  - changed-files:
    - any-glob-to-any-file:
      - 'tests/**/*'
      - '**/*_test.py'
      - '**/test_*.py'

# CI/CD changes
ci-cd:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/**'
      - '.github/**'

# Security configuration
security:
  - changed-files:
    - any-glob-to-any-file:
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/semgrep.yml'

# Dependencies
dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - 'requirements*.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'Pipfile'
      - 'poetry.lock'

# Documentation
documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - 'docs/**/*'

# Configuration
configuration:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.toml'
      - '**/*.ini'
      - '**/*.cfg'
      - '.pylintrc'
