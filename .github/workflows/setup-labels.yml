name: Setup Repository Labels

# Run manually or on first setup
on:
  workflow_dispatch:

jobs:
  setup-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create/Update Labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              // Workflow Labels
              { name: 'pre-commit', color: '1d76db', description: 'Pre-commit CI workflow' },
              { name: 'semgrep', color: 'b60205', description: 'Semgrep security scan workflow' },

              // CI/CD Labels
              { name: 'ci-passed', color: '0e8a16', description: 'All CI checks passed' },
              { name: 'ci-failed', color: 'd73a4a', description: 'CI checks failed' },

              // Security Labels
              { name: 'security', color: 'b60205', description: 'Security related changes' },
              { name: 'security-review-needed', color: 'd93f0b', description: 'Requires security team review' },
              { name: 'security-findings', color: 'e99695', description: 'Security scan found issues' },
              { name: 'security-passed', color: '0e8a16', description: 'Security scan passed' },
              { name: 'semgrep-failed', color: 'f9d0c4', description: 'Semgrep scan failed' },

              // Priority Labels
              { name: 'priority: critical', color: 'b60205', description: 'Critical priority' },
              { name: 'priority: high', color: 'd93f0b', description: 'High priority' },
              { name: 'priority: medium', color: 'fbca04', description: 'Medium priority' },
              { name: 'priority: low', color: '0e8a16', description: 'Low priority' },

              // Type Labels
              { name: 'hotfix', color: 'd73a4a', description: 'Emergency hotfix' },
              { name: 'bug', color: 'd73a4a', description: 'Bug fix' },
              { name: 'enhancement', color: 'a2eeef', description: 'New feature or enhancement' },
              { name: 'dependencies', color: '0366d6', description: 'Dependency updates' },

              // Component Labels
              { name: 'python', color: '3572A5', description: 'Python code changes' },
              { name: 'tests', color: 'c5def5', description: 'Test related changes' },
              { name: 'ci-cd', color: '1d76db', description: 'CI/CD pipeline changes' },
              { name: 'documentation', color: '0075ca', description: 'Documentation changes' },
              { name: 'configuration', color: 'fef2c0', description: 'Configuration changes' },

              // Status Labels
              { name: 'ready-for-review', color: '0e8a16', description: 'Ready for code review' },
              { name: 'work-in-progress', color: 'fbca04', description: 'Work in progress' },
              { name: 'blocked', color: 'd73a4a', description: 'Blocked by dependencies' },
              { name: 'needs-testing', color: 'f9d0c4', description: 'Needs testing' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                console.log(`✅ Created label: ${label.name}`);
              } catch (error) {
                if (error.status === 422) {
                  // Label already exists, update it
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  console.log(`🔄 Updated label: ${label.name}`);
                } else {
                  console.error(`❌ Error with label ${label.name}:`, error.message);
                }
              }
            }
