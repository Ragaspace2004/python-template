name: Auto Label PRs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Label based on branch
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Add workflow labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [];

            // Add label based on PR title or branch
            const title = context.payload.pull_request.title.toLowerCase();
            const branch = context.payload.pull_request.head.ref.toLowerCase();

            if (title.includes('security') || branch.includes('security')) {
              labels.push('security');
            }
            if (title.includes('hotfix') || branch.includes('hotfix')) {
              labels.push('hotfix', 'priority: high');
            }
            if (title.includes('deps') || title.includes('dependency')) {
              labels.push('dependencies');
            }
            if (branch.includes('feature/')) {
              labels.push('enhancement');
            }
            if (branch.includes('bugfix/') || branch.includes('fix/')) {
              labels.push('bug');
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labels
              });
            }
