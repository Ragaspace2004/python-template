repos:
  # Universal pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-xml

  # Ruff: Fast Python linter + formatter (replaces Pylint + Black + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Linting
      - id: ruff
        name: ruff 🧹
        args: ["check", "--fix"]
      # Formatting
      - id: ruff-format
        name: ruff-format 🧹

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy 🔍
        args: ["--ignore-missing-imports", "--show-error-codes"]

  # Python SAST with Bandit (BLOCKS commits on security issues)
  - repo: local
    hooks:
      - id: bandit
        name: bandit (security) 🔎
        entry: python -m bandit
        language: system
        types: [python]
        files: \.py$
        args: ["-c", "pyproject.toml", "-r", "."]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        name: gitleaks 🔑
        args: ["--verbose", "--config=.gitleaks.toml"]

  # Python tests
  - repo: local
    hooks:
      - id: pytest
        name: pytest 🧪
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
