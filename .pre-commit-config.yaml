repos:
  # Universal pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-xml

  # Ruff: Fast Python linter + formatter (replaces Pylint + Black + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.2
    hooks:
      # Linting
      - id: ruff
        name: ruff 🧹
        args: ["check", "--fix"]
      # Formatting
      - id: ruff-format
        name: ruff-format 🧹


  # Python security linting with Bandit (BLOCKS commits on security issues)
  - repo: local
    hooks:
      - id: bandit
        name: bandit (security) 🔎
        entry: python -m bandit
        language: system
        types: [python]
        files: \.py$
        args: ["-ll"]
        pass_filenames: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        name: gitleaks 🔑
        args: ["--verbose", "--config=.gitleaks.toml"]

  # Python tests
  - repo: local
    hooks:
      - id: pytest
        name: pytest 🧪
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
